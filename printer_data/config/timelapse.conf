[timelapse]
output_path: ~/printer_data/timelapse/
frame_path: /tmp/timelapse/printer
enabled: true
mode: layermacro
saveFrames: false
pixelFormat: yuv450p
autorender: true
parkhead: true
parkpos: custom
park_custom_x: 210
park_custom_y: 110
park_custom_dz: 10
park_travel_speed: 150
park_retract_speed: 25
park_extrude_speed: 25
park_retract_distance: 1.0
park_extrude_distance: 1.0
